##### =========================================================
##### Tmux Configuration
##### Target:
#####   - Debian 13
#####   - KDE Plasma
#####   - Kitty Terminal
##### Optional:
#####   - Windows Terminal / WSL compatible
##### =========================================================

##### ---------------------------------------------------------
##### Basic
##### ---------------------------------------------------------

set -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on
set -g detach-on-destroy off

set -g escape-time 0
set -sg repeat-time 600

set -g history-limit 200000

set -g focus-events on

set -g extended-keys on

set -g mouse on

set -g set-clipboard on

set -g allow-passthrough on

set -g assume-paste-time 1

set -g display-time 3000
set -g display-panes-time 1500

set -g status-interval 1

set -g repeat-time 300

set -g terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',*:Tc'

##### ---------------------------------------------------------
##### Terminal / True Color
##### ---------------------------------------------------------

set -g default-terminal "tmux-256color"

# Kitty
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',xterm-kitty:clipboard'
set -as terminal-features ',xterm-kitty:ccolour'
set -as terminal-features ',xterm-kitty:extkeys'

# Windows Terminal / WSL
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',wezterm:RGB'

##### ---------------------------------------------------------
##### UTF-8
##### ---------------------------------------------------------

# set -g utf8 on
# setw -g utf8 on

##### ---------------------------------------------------------
##### Prefix
##### ---------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### ---------------------------------------------------------
##### Vi Mode
##### ---------------------------------------------------------

setw -g mode-keys vi
set -g status-keys vi

##### ---------------------------------------------------------
##### Copy Mode
##### ---------------------------------------------------------

bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line-and-cancel

bind -T copy-mode-vi Escape send -X cancel

bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind -T copy-mode-vi J send -X scroll-down
bind -T copy-mode-vi K send -X scroll-up

bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down

bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom

##### ---------------------------------------------------------
##### Clipboard Integration
##### ---------------------------------------------------------

# Linux Wayland
if-shell 'command -v wl-copy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'

# Linux X11
if-shell 'command -v xclip >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# macOS
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

##### ---------------------------------------------------------
##### Splits
##### ---------------------------------------------------------

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

##### ---------------------------------------------------------
##### Pane Navigation
##### ---------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

##### ---------------------------------------------------------
##### Pane Resize
##### ---------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### ---------------------------------------------------------
##### Window Navigation
##### ---------------------------------------------------------

bind -r n next-window
bind -r p previous-window

bind Tab last-window

bind -r Left previous-window
bind -r Right next-window

##### ---------------------------------------------------------
##### Window Management
##### ---------------------------------------------------------

bind-key r command-prompt -I "#W" "rename-window '%%'"

bind-key R source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind-key x kill-pane
bind-key X kill-window

bind-key q display-panes

##### ---------------------------------------------------------
##### Synchronize Panes
##### ---------------------------------------------------------

bind-key s setw synchronize-panes

##### ---------------------------------------------------------
##### Session Management
##### ---------------------------------------------------------

bind-key S choose-session

bind-key C-f command-prompt -p "find-window:" \
    "find-window '%%'"

##### ---------------------------------------------------------
##### Zoom
##### ---------------------------------------------------------

bind z resize-pane -Z

##### ---------------------------------------------------------
##### Smart Reload
##### ---------------------------------------------------------

bind-key F5 source-file ~/.tmux.conf \; \
    display-message "Configuration Reloaded"

##### ---------------------------------------------------------
##### Activity / Bell
##### ---------------------------------------------------------

setw -g monitor-activity on
set -g visual-activity off

set -g bell-action none
set -g visual-bell off

##### ---------------------------------------------------------
##### Auto Rename
##### ---------------------------------------------------------

setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S:#I:#W"

##### ---------------------------------------------------------
##### Scroll
##### ---------------------------------------------------------

set -g terminal-overrides 'xterm*:smcup@:rmcup@'

##### ---------------------------------------------------------
##### Performance
##### ---------------------------------------------------------

set -g status-interval 2

set -g message-style "bg=#1e1e2e,fg=#cdd6f4"

##### ---------------------------------------------------------
##### Colors
##### ---------------------------------------------------------

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

set -g mode-style "bg=#313244,fg=#cdd6f4"

set -g clock-mode-colour "#89b4fa"

##### ---------------------------------------------------------
##### Status Bar
##### ---------------------------------------------------------

set -g status-position bottom
set -g status-justify left

set -g status-left-length 100
set -g status-right-length 150

set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]|"

set -g status-right "\
#[fg=#6c7086]#{?window_zoomed_flag,[Z],} \
#[fg=#f9e2af]CPU:#{cpu_percentage} \
#[fg=#a6e3a1]RAM:#{ram_percentage} \
#[fg=#89b4fa]%Y-%m-%d \
#[fg=#cba6f7]%H:%M:%S "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

setw -g window-status-style "fg=#bac2de,bg=#1e1e2e"
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa"

##### ---------------------------------------------------------
##### Pane Indicators
##### ---------------------------------------------------------

set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#6c7086"

##### ---------------------------------------------------------
##### Plugins
##### ---------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Yank clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# CPU / RAM
set -g @plugin 'tmux-plugins/tmux-cpu'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Better navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin
set -g @plugin 'catppuccin/tmux'

##### ---------------------------------------------------------
##### Continuum
##### ---------------------------------------------------------

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### ---------------------------------------------------------
##### Resurrect
##### ---------------------------------------------------------

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh vim nvim zsh bash fish'

##### ---------------------------------------------------------
##### Vim Navigator
##### ---------------------------------------------------------

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

##### ---------------------------------------------------------
##### Kitty Specific
##### ---------------------------------------------------------

set -ga update-environment " KITTY_WINDOW_ID"

##### ---------------------------------------------------------
##### SSH Friendly
##### ---------------------------------------------------------

set -g update-environment \
    "DISPLAY \
    WAYLAND_DISPLAY \
    XAUTHORITY \
    SSH_AGENT_PID \
    SSH_AUTH_SOCK \
    WINDOWID \
    XDG_CURRENT_DESKTOP \
    XDG_SESSION_TYPE \
    XDG_RUNTIME_DIR \
    DBUS_SESSION_BUS_ADDRESS"

##### ---------------------------------------------------------
##### KDE Friendly
##### ---------------------------------------------------------

set -g update-environment "KONSOLE_VERSION KDE_FULL_SESSION"

##### ---------------------------------------------------------
##### Better Defaults
##### ---------------------------------------------------------

set-option -g aggressive-resize on

setw -g xterm-keys on

setw -g allow-rename off

##### ---------------------------------------------------------
##### Session Auto Start
##### ---------------------------------------------------------

if-shell '[ -z "#{session_name}" ]' 'new-session'

##### ---------------------------------------------------------
##### TPM Bootstrap
##### ---------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'

##### ---------------------------------------------------------
##### Notes
##### ---------------------------------------------------------
# Install TPM:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Install plugins:
#   Prefix + I
#
# Reload:
#   Prefix + R
#
# Save session:
#   Prefix + Ctrl-s
#
# Restore session:
#   Prefix + Ctrl-r
#
##### =========================================================
