# cross(cross-rs)交叉编译配置:https://github.com/cross-rs/cross
# 用法:
#   cross build --release --target <target>
#   cross test --target <target>
# 前置条件:需要 Docker(或 podman);每个目标先 `rustup target add <target>`。
#
# 按项目实际需求保留目标,其余注释掉——目标越多,构建越慢。
# 镜像 tag 统一用 "main",跟随 cross 最新版本;要固定版本可改用如 "0.2.5" 之类的 tag。
# macOS 目标(aarch64-apple-darwin 等)为实验性支持,需要设置环境变量
# XCODE_VERSION=<版本号>(例如 15.2)让 cross 拉取 Xcode SDK。

[build.env]
# 透传给交叉编译容器的宿主环境变量
passthrough = ["RUSTFLAGS", "RUST_BACKTRACE"]

# ---- Linux musl:静态链接,可直接拷贝进容器/嵌入式/分发 ----
[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"

[target.armv7-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-musleabihf:main"

[target.arm-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/arm-unknown-linux-musleabihf:main"

# ---- Linux gnu:动态链接,依赖宿主 glibc ----
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"

# ---- Windows ----
[target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu:main"

[target.i686-pc-windows-gnu]
image = "ghcr.io/cross-rs/i686-pc-windows-gnu:main"

# ---- macOS(实验性,见文件头注释)----
[target.x86_64-apple-darwin]
image = "ghcr.io/cross-rs/x86_64-apple-darwin:main"

[target.aarch64-apple-darwin]
image = "ghcr.io/cross-rs/aarch64-apple-darwin:main"
